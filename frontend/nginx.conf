server {
  listen ${NGINX_PORT};
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  location / {
    try_files $uri $uri/ /index.html;
  }

  # SSE scan-progress stream: must not be buffered or gzipped, or events
  # get delayed/batched instead of arriving as they're emitted.
  location ~ ^/sources/[^/]+/scan-progress$ {
    proxy_pass http://localhost:15765;
    proxy_http_version 1.1;
    proxy_set_header Connection '';
    proxy_buffering off;
    proxy_cache off;
    gzip off;
    proxy_read_timeout 3600s;
  }

  location /sources {
    proxy_pass http://localhost:15765;
  }

  location /photos {
    proxy_pass http://localhost:15765;
  }

  location /settings {
    proxy_pass http://localhost:15765;
  }

  location /calendar {
    proxy_pass http://localhost:15765;
  }

  location /weather {
    proxy_pass http://localhost:15765;
  }
}
